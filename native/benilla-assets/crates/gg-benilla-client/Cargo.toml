[package]
name = "gg-benilla-client"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
anyhow = "1"
serde_json = "1"
benilla-protocol = { path = "../benilla-protocol" }
benilla-srp = { path = "../benilla-srp" }
[build-dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
